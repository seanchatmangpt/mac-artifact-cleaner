[package]
name = "osx-clnr"
version = "26.7.3"
edition = "2021"
# House standard is 1.82; osx-clnr uses io::ErrorKind::StorageFull (stable 1.83).
rust-version = "1.83"
license = "MIT OR Apache-2.0"
description = "Receipted macOS developer disk auditor and cleanup utility: audit, plan, delete, verify — with cryptographic receipts."
repository = "https://github.com/seanchatmangpt/mac-artifact-cleaner"
homepage = "https://github.com/seanchatmangpt/mac-artifact-cleaner"
readme = "README.md"
keywords = ["macos", "disk", "cleanup", "receipts", "praxis"]
categories = ["command-line-utilities", "filesystem", "development-tools"]
default-run = "oclnr"

[lints]
workspace = true

[[bin]]
name = "oclnr"
path = "src/main.rs"

[[bin]]
name = "oclnr-mcp"
path = "src/mcp_main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
jwalk = "0.8"
wasm4pm-compat = { version = "26.6.8", features = ["formats", "strict"] }
blake3 = "1.8.5"
dialoguer = "0.12.0"
colored = "3.1.1"
clap_complete = "4.6.5"
which = "8.0.3"
notify = "8.2.0"
sled = "0.34.7"
once_cell = "1.21.4"
toml = "1.1.2"
libc = "0.2"
clap-noun-verb = "26.6.2"
clap-noun-verb-macros = "26.6.2"
linkme = "0.3"
# `core` only: the `discovery`/`conformance` features pull `wasm4pm`, which
# hard-pins `wasm-bindgen =0.2.100` and conflicts with chrono's transitive
# `wasm-bindgen`. Core gives us chain assembly, the 7-stage verifier, and the
# dual-court admission gate — everything Pentecost needs to seal deletions.
affidavit = { version = "26.6.22", default-features = false, features = ["core"] }
# MCP server dependencies
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
star-toml = "26.6.30"

[dev-dependencies]
tempfile = "3"

[workspace]
members = [
    "cfab-surface",
]

[workspace.lints.rust]
# House standard uses `forbid`; osx-clnr carries two audited unsafe blocks
# (libc::statvfs free-space sampling), so `deny` with targeted allows.
unsafe_code = "deny"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
