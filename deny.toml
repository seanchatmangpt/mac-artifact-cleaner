# cargo-deny configuration (schema v2; targets cargo-deny >= 0.16).
# Run locally with `cargo deny check` or `just deny`; enforced in CI.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
# RustSec advisory DB — local cache and upstream URL.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Schema v2: vulnerabilities are always denied. `unmaintained` takes a scope.
unmaintained = "workspace"
yanked = "warn"
ignore = []

[licenses]
version = 2
# House policy: permissive licenses only. Copyleft (GPL/AGPL/LGPL) is denied
# by omission so a transitive copyleft dep fails CI loudly.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    # MPL-2.0 is file-level weak copyleft (colored crate); acceptable as an
    # unmodified dependency.
    "MPL-2.0",
]
confidence-threshold = 0.9
[[licenses.exceptions]]
# wasm4pm is a first-party seanchatmangpt repo using BUSL-1.1 / BSL-1.1.
# Not redistributed; source available under business-source terms.
# See https://mariadb.com/bsl11/ for license text.
allow = ["BUSL-1.1"]
name = "wasm4pm"
version = "*"

[[licenses.exceptions]]
# dteam is a first-party seanchatmangpt repo using BUSL-1.1 / BSL-1.1.
allow = ["BUSL-1.1"]
name = "dteam"
version = "*"

[[licenses.exceptions]]
# miniml is a first-party seanchatmangpt repo using BUSL-1.1 / BSL-1.1.
allow = ["BUSL-1.1"]
name = "miniml"
version = "*"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path deps within the house ecosystem are allowed to use wildcard versions.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/seanchatmangpt/affidavit"]
[sources.allow-org]
github = ["seanchatmangpt"]
